[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "going-once-api"
version = "0.1.0"
description = "Core API service: auth, users, listings, search."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "structlog>=24.4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.28", "ruff>=0.8", "mypy>=1.13"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint.per-file-ignores]
# Alembic generates these files; we don't hand-edit them, so skip E501 here.
"migrations/**" = ["E501"]
[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "C4", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run: the async engine's connection pool is
# created at import time, and connections cannot move between loops.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]